[project]
name = "bilisum"
version = "0.1.0"
description = "B站视频内容总结工具：字幕优先 + 本地 ASR 兜底 + 本地 LLM 总结"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "faster-whisper>=1.1",
    # av 19 移除了 metadata_errors 参数，而 faster-whisper 1.2.1 仍在用，必须钉住
    "av>=14,<15",
    # 抽帧存图（画面文字提取用）
    "pillow>=10",
]

[project.scripts]
bilisum = "bilisum.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilisum"]
